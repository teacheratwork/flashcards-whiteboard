# Publishes the app on GitHub Pages at every push to main.
# Only the built page in dist/ is published (src/, tools/, README, etc. stay out).
# Rebuild with tools/build.py and commit dist/ before pushing.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:   # also allows a manual run from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
